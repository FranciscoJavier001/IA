<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ececea;
      --card: #ffffff;
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.25);
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-tertiary: #9a9890;
      --danger-bg: #fcebeb;
      --danger-text: #a32d2d;
      --danger-border: rgba(163,45,45,0.3);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --surface: #252523;
        --card: #2c2c2a;
        --border: rgba(255,255,255,0.1);
        --border-hover: rgba(255,255,255,0.25);
        --text-primary: #eeecea;
        --text-secondary: #b4b2a9;
        --text-tertiary: #6b6a66;
        --danger-bg: #2e1515;
        --danger-text: #f09595;
        --danger-border: rgba(240,149,149,0.25);
      }
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    .display-block {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1.25rem 1.25rem;
      margin-bottom: 1rem;
    }

    .counter-value {
      font-size: 80px;
      font-weight: 500;
      line-height: 1;
      color: var(--text-primary);
      display: inline-block;
      transition: text-decoration 0.2s;
    }

    .counter-value.edited {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 8px;
    }

    .real-count {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 8px;
      min-height: 18px;
      transition: opacity 0.2s;
    }

    .real-count.hidden { opacity: 0; pointer-events: none; }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }

    input[type="number"] {
      flex: 1;
      height: 42px;
      font-size: 16px;
      text-align: center;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border);
      background: var(--card);
      color: var(--text-primary);
      padding: 0 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="number"]:focus {
      border-color: var(--border-hover);
      box-shadow: 0 0 0 3px rgba(128,128,128,0.1);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    button {
      cursor: pointer;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--card);
      color: var(--text-primary);
      font-family: inherit;
      transition: background 0.15s, transform 0.1s, color 0.15s, border-color 0.15s;
    }

    button:active { transform: scale(0.97); }

    .btn-apply {
      height: 42px;
      padding: 0 16px;
      font-size: 14px;
    }

    .btn-apply:hover { background: var(--surface); }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-add {
      flex: 1;
      height: 56px;
      font-size: 22px;
      font-weight: 500;
      border-radius: var(--radius-lg);
    }

    .btn-add:hover { background: var(--surface); }

    .btn-reset {
      height: 56px;
      padding: 0 18px;
      font-size: 13px;
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
    }

    .btn-reset:hover {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-color: var(--danger-border);
    }

    .pulse {
      animation: pulse 0.18s ease-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="display-block">
    <div class="label">Valor actual</div>
    <div class="counter-value" id="display">0</div>
    <div class="real-count hidden" id="real-label">
      pulsaciones reales: <span id="real-num">0</span>
    </div>
  </div>

  <div class="label">Editar número manualmente</div>
  <div class="input-row">
    <input type="number" id="edit-input" placeholder="Escribe un número..." />
    <button class="btn-apply" id="btn-apply">Aplicar</button>
  </div>

  <div class="btn-row">
    <button class="btn-add" id="btn-add" aria-label="Sumar uno">+ 1</button>
    <button class="btn-reset" id="btn-reset" aria-label="Reiniciar contador">
      <i class="ti ti-refresh"></i> Reiniciar
    </button>
  </div>
</div>

<script>
  let presses = 0;
  let displayed = 0;

  const displayEl  = document.getElementById('display');
  const realLabel  = document.getElementById('real-label');
  const realNum    = document.getElementById('real-num');
  const editInput  = document.getElementById('edit-input');
  const btnApply   = document.getElementById('btn-apply');
  const btnAdd     = document.getElementById('btn-add');
  const btnReset   = document.getElementById('btn-reset');

  function update() {
    displayEl.textContent = displayed;
    const edited = displayed !== presses;
    displayEl.classList.toggle('edited', edited);
    realLabel.classList.toggle('hidden', !edited);
    if (edited) realNum.textContent = presses;
  }

  function animatePulse() {
    displayEl.classList.remove('pulse');
    void displayEl.offsetWidth;
    displayEl.classList.add('pulse');
    displayEl.addEventListener('animationend', () => displayEl.classList.remove('pulse'), { once: true });
  }

  btnAdd.addEventListener('click', () => {
    presses++;
    displayed++;
    animatePulse();
    update();
  });

  btnApply.addEventListener('click', () => {
    const val = parseInt(editInput.value, 10);
    if (!isNaN(val)) {
      displayed = val;
      editInput.value = '';
      update();
    }
    editInput.focus();
  });

  editInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') btnApply.click();
  });

  btnReset.addEventListener('click', () => {
    presses = 0;
    displayed = 0;
    editInput.value = '';
    update();
  });

  update();
</script>

</body>
</html>
